
# DATABASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbershop_dev}
spring.datasource.username=${DB_USERNAME:haircut_app}
spring.datasource.password=${DB_PASSWORD:haircut_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# GRAPHQL
spring.graphql.graphiql.enabled=true
app.security.graphql-public=true

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms
