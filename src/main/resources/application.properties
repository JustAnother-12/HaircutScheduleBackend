spring.application.name=HaircutSchedule

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# Default profile for local development
spring.profiles.default=dev

spring.config.import=optional:file:.env[.properties]

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# GraphQL
spring.graphql.http.path=/graphql

# CORS
spring.graphql.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.max-age=3600s
