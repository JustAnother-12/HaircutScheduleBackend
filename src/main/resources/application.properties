spring.application.name=HaircutSchedule

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# Default profile for local development
spring.profiles.default=dev

spring.config.import=optional:file:.env[.properties]

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# GraphQL
spring.graphql.http.path=/graphql

# CORS
spring.graphql.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.max-age=3600s

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-hours=${JWT_ACCESS_EXPIRATION_HOURS:2}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s

# EMAIL
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ACTION TOKEN
app.auth.registration-token-ttl=PT24H
app.auth.password-reset-token-ttl=PT15M
