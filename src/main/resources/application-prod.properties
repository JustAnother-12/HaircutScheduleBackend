# MySQL config
spring.datasource.url=jdbc:mysql://localhost:3306/barbershop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
